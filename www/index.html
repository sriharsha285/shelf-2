<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bookshelf"><title>Bookshelf</title>
<style>
:root{--bg:#fff;--card:#f4f4f6;--tx:#111114;--mut:#8b8b94;--ac:#2563eb;--bd:#e6e6ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0f;--card:#1a1a1f;--tx:#f3f3f5;--mut:#8b8b94;--ac:#5b8cff;--bd:#2a2a31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0c0f;--card:#1a1a1f;--tx:#f3f3f5;--mut:#8b8b94;--ac:#5b8cff;--bd:#2a2a31;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:20px 20px 110px;max-width:640px;width:100%;margin:0 auto}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:8px 0 20px}
button{font:inherit;color:inherit}
.big{display:block;width:100%;height:56px;border:0;border-radius:16px;background:var(--ac);color:#fff;font-weight:700;font-size:17px;text-align:center;line-height:56px;cursor:pointer}
.big.g{background:var(--card);color:var(--tx)}
.dock{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:0 20px;max-width:640px;margin:0 auto}
nav{position:fixed;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:608px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:22px;background:var(--card);border:1px solid var(--bd)}
nav button{flex:1;height:48px;border:0;border-radius:16px;background:none;color:var(--mut);font-weight:600;cursor:pointer}
nav button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 4px #0002}
.li{display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 18px;margin-bottom:10px;background:var(--card);border-radius:18px;cursor:pointer;font-weight:700;font-size:18px}
.li span{color:var(--mut);font-weight:500;font-size:14px}
.li .x{border:0;background:none;color:var(--mut);font-size:18px;padding:12px;margin-right:-10px}
.row{display:flex;gap:10px;margin:16px 0}
input[type=text],input[type=time]{flex:1;height:52px;padding:0 16px;border:0;border-radius:16px;background:var(--card);color:var(--tx);font:inherit;min-width:0}
.row .big{width:90px;flex:none}
.back{border:0;background:none;color:var(--ac);font-weight:600;font-size:16px;padding:8px 0;margin-bottom:-4px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px}
.bk{cursor:pointer;min-width:0}
.cv{position:relative;aspect-ratio:2/3;background:var(--card);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;box-shadow:0 2px 10px #0002}
.cv img{width:100%;height:100%;object-fit:cover}
.pb{height:4px;background:var(--bd);border-radius:2px;margin:10px 0 4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);border-radius:2px}
.bk small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{position:absolute;top:4px;right:4px;border:0;border-radius:10px;background:#000a;color:#fff;font-size:12px;padding:5px 8px}
.set{display:flex;justify-content:space-between;align-items:center;min-height:68px;padding:12px 18px;margin-bottom:10px;background:var(--card);border-radius:18px;font-weight:600}
.set small{display:block;color:var(--mut);font-weight:400}
.set input{height:38px;margin-top:6px;width:130px;flex:none}
.sw{width:52px;height:32px;border-radius:16px;background:var(--bd);border:0;position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.sw.on{background:var(--ac)}.sw.on::after{left:23px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:-6px -20px 18px;padding:0 20px 4px;scrollbar-width:none}.chip{flex:none;height:44px;padding:0 18px;border:0;border-radius:22px;background:var(--card);color:var(--mut);font-weight:600;cursor:pointer}.chip.on{background:var(--ac);color:#fff}
html{overscroll-behavior:none}
.bk{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.sheet{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end}
.sh{max-height:75vh;overflow:auto;width:100%;max-width:640px;margin:0 auto;background:var(--bg);color:var(--tx);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sh p{margin:0 0 16px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{color:var(--mut);font-size:13px;margin:10px 4px}
#ban{background:var(--ac);color:#fff;padding:12px;text-align:center;display:none;font-weight:600}
#rd{position:fixed;inset:0;background:var(--bg);display:none;z-index:5;flex-direction:column}
#rd.show{display:flex}
#stage{flex:1;position:relative;perspective:1600px;overflow:hidden;min-height:0}
#pg{position:absolute;inset:0;overflow:auto;touch-action:pan-y;text-align:center}
#rib{position:absolute;top:0;right:22px;width:26px;height:42px;background:var(--ac);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);z-index:4;display:none}
.rb .ic{width:44px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.rb .mk{color:var(--ac)}.rb .mk path{fill:currentColor}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;display:none;max-width:86%;text-align:center}
#pg canvas{display:block;margin:0 auto}
.rb{position:absolute;left:0;right:0;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);transition:opacity .2s,transform .2s;z-index:6}
.rb.t{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--bd)}
.rb.b{bottom:0;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}
#rd.hide .rb{opacity:0;pointer-events:none}
.rb .t1{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb button{height:44px;padding:0 16px;border:0;border-radius:14px;background:var(--card);font-weight:600}
input[type=range]{flex:1;height:44px;accent-color:var(--ac)}
#rp{font-variant-numeric:tabular-nums;font-weight:600;min-width:84px;text-align:right;font-size:14px}

</style></head><body>
<div id="ban"></div>
<main id="main"></main>
<nav><button data-t="all" class="on">Library</button><button data-t="lib">Books</button><button data-t="set">Settings</button></nav>
<div id="rd"><div class="rb t"><button id="cl">‹ Close</button><span class="t1" id="rt"></span>
<button class="ic" id="bm" aria-label="Bookmark this page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
<button class="ic" id="bl" aria-label="Bookmarks"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
<button class="ic" id="fs" aria-label="Full screen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
<div id="stage"><div id="rib"></div><div id="pg"><canvas id="cv"></canvas></div></div>
<div class="rb b"><input type="range" id="sl" min="1" max="1" value="1"><span id="rp"></span></div></div>

<div id="toast"></div>
<script src="pdf.min.js"></script>
<script src="pdf.worker.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const NP=(window.Capacitor&&Capacitor.Plugins)||{};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let S={cats:['Fiction','Stories','Poems'],days:{},set:{theme:'auto',full:false,remind:false,time:'20:00'},notified:''};
try{const r=localStorage.getItem('bs_state');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('bs_state',JSON.stringify(S))}catch(e){}};
try{pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js'}catch(e){}

let db,mem={};
const open=()=>new Promise(res=>{try{const q=indexedDB.open('bookshelf',1);q.onupgradeneeded=()=>q.result.createObjectStore('books',{keyPath:'id'});q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>res()}catch(e){res()}});
const dbOp=(m,f)=>new Promise(res=>{const t=db.transaction('books',m),r=f(t.objectStore('books'));if(r&&'onsuccess' in r)r.onsuccess=()=>res(r.result);else t.oncomplete=()=>res()});
const allBooks=()=>db?dbOp('readonly',s=>s.getAll()):Promise.resolve(Object.values(mem));
const putBook=b=>db?dbOp('readwrite',s=>s.put(b)):(mem[b.id]=b,Promise.resolve());
const delBook=id=>db?dbOp('readwrite',s=>s.delete(id)):(delete mem[id],Promise.resolve());

let tab='all',lcat='',cat=null,books=[],pend=null;
const today=()=>S.days[dk()]||0;
function addRead(n){const k=dk();S.days[k]=(S.days[k]||0)+n;save()}
const pct=b=>Math.min(100,Math.round(b.max/b.total*100));

async function render(){
 const m=$('#main');books=await allBooks();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(tab==='lib'||tab==='all'){
  if(tab==='lib'&&!cat){
   m.innerHTML=`<h1>Books</h1>${S.cats.map((c,i)=>{const n=books.filter(b=>b.cat===c).length;return`<div class="li" data-c="${i}"><div>${esc(c)}<br><span>${n} ${n===1?'book':'books'}</span></div>${n?'<span>›</span>':`<button class="x" data-d="${i}">✕</button>`}</div>`}).join('')}
   <div class="row"><input type="text" id="nc" placeholder="New shelf name"><button class="big" id="ac">Add</button></div>`;
   m.querySelectorAll('.li').forEach(e=>e.onclick=ev=>{if(ev.target.dataset.d!==undefined){S.cats.splice(+ev.target.dataset.d,1);save();render();return}cat=S.cats[+e.dataset.c];render()});
   $('#ac').onclick=()=>{const v=$('#nc').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save();render()}};
  }else{
   const isAll=tab==='all',cc=isAll?lcat:cat,bs=books.filter(b=>cc?b.cat===cc:true);
   m.innerHTML=`${isAll?`<h1>Library</h1>`:`<button class="back" id="bk">‹ Books</button><h1>${esc(cat)}</h1>`}<div id="msg" class="note"></div>
   ${bs.length?`<div class="grid">${bs.map(b=>`<div class="bk" data-id="${b.id}"><div class="cv">${b.cover?`<img src="${b.cover}">`:'No cover'}</div><div class="pb"><i style="width:${pct(b)}%"></i></div><b>${esc(b.name)}</b><small>${pct(b)}% · ${b.max}/${b.total}</small></div>`).join('')}</div>`:`<p class="note">No books here yet.${cc?' Tap the button below to add one.':' Add books from a shelf in the Books tab.'}</p>`}
   ${cc?`<div class="dock"><label class="big">+ Add book<input type="file" id="fi" accept="application/pdf" multiple hidden></label></div>`:''}`;
   if($('#bk'))$('#bk').onclick=()=>{cat=null;render()};m.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{lcat=c.dataset.ch;render()});
   if($('#fi'))$('#fi').onchange=async e=>{for(const f of e.target.files){$('#msg').textContent='Adding '+f.name+'…';try{await addBook(f)}catch(er){$('#msg').textContent='Could not read '+f.name;return}}render()};
   m.querySelectorAll('.bk').forEach(e=>{let t=null,lp=false;const id=e.dataset.id,en=()=>clearTimeout(t);
    e.addEventListener('touchstart',()=>{lp=false;t=setTimeout(()=>{lp=true;askRemove(id)},550)},{passive:true});
    ['touchend','touchmove','touchcancel'].forEach(n=>e.addEventListener(n,en,{passive:true}));
    e.addEventListener('contextmenu',ev=>{ev.preventDefault();askRemove(id)});
    e.onclick=()=>{if(lp){lp=false;return}openBook(books.find(b=>b.id===id))}});
  }
 }else{
  const s=S.set,sw=(k,on)=>`<button class="sw ${on?'on':''}" data-k="${k}"></button>`;
  const dark=document.documentElement.dataset.theme==='dark';
  m.innerHTML=`<h1>Settings</h1>
  <div class="set"><div>Dark mode</div>${sw('dark',dark)}</div>
  
  <div class="set"><div>Smart notifications<small>A nudge to resume your book</small></div>${sw('remind',s.remind)}</div>
  <p class="note" id="sn"></p>
  <p class="note">Your screen stays on automatically while you read. To remove a book, press and hold it. Reminders work while this page is open. Browsers may block notifications or full screen in embedded views, so open it in your phone’s browser and use “Add to Home Screen” to launch it like an app.</p>`;
  
  m.querySelectorAll('.sw').forEach(b=>b.onclick=()=>toggle(b.dataset.k));
 }
}
async function toggle(k){
 const s=S.set;
 if(k==='dark'){s.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}
 
 if(k==='remind'){s.remind=!s.remind;if(s.remind){try{if(NP.LocalNotifications)await NP.LocalNotifications.requestPermissions();else if('Notification' in window){await Notification.requestPermission();if(Notification.permission==='granted')new Notification('Bookshelf',{body:smartMsg()})}}catch(e){}}save();sched()}
 save();applyTheme();render();
}
function applyTheme(){const t=S.set.theme,r=document.documentElement;r.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t;r.dataset.style='minimal'}

document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&imm)imm=false});

// auto screen-on while reading
let wl=null;
async function wake(on){try{if(NP.KeepAwake){if(on)await NP.KeepAwake.keepAwake();else await NP.KeepAwake.allowSleep();return}if(on){wl=await navigator.wakeLock.request('screen')}else if(wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&pdfDoc)wake(true)});

let st1=null;const schedSoon=()=>{clearTimeout(st1);st1=setTimeout(sched,1500)};
async function sched(){const L=NP.LocalNotifications;if(!L)return;try{await L.cancel({notifications:[{id:1}]});if(!S.set.remind)return;
 const at=new Date();at.setHours(19,0,0,0);if(at<=new Date()||today()>0)at.setDate(at.getDate()+1);
 await L.schedule({notifications:[{id:1,title:'Bookshelf',body:smartMsg(),smallIcon:'ic_stat_book',schedule:{at,allowWhileIdle:true}}]})}catch(e){}}
function smartMsg(){const l=S.last;if(!l)return 'Time to read 📖 Pick a book and turn a page.';
 const a=[`Page ${l.page} of “${l.name}” is waiting for you 📖`,`Pick up “${l.name}” right where you left off — page ${l.page}`,`You’re ${l.pct}% through “${l.name}”. A few pages tonight?`];return a[new Date().getDate()%a.length]}
function remind(){const s=S.set;if(!s.remind||today()>0)return;const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
 if(hm>='19:00'&&S.notified!==dk()){S.notified=dk();save();const t=smartMsg();
  try{if(Notification.permission==='granted')new Notification('Bookshelf',{body:t})}catch(e){}
  const b=$('#ban');b.textContent=t;b.style.display='block';b.onclick=()=>b.style.display='none'}}
setInterval(remind,30000);

function askRemove(id){const b=books.find(x=>x.id===id);if(!b)return;const o=document.createElement('div');o.className='sheet';
 o.innerHTML=`<div class="sh"><p>${esc(b.name)}</p><button class="big" id="rm" style="background:#e5484d">Remove from library</button><button class="big g" id="kp" style="margin-top:10px">Keep it</button></div>`;
 document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};o.querySelector('#kp').onclick=()=>o.remove();
 o.querySelector('#rm').onclick=async()=>{await delBook(id);o.remove();render()}}
async function addBook(f){
 const buf=await f.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
 const p=await pdf.getPage(1),v=p.getViewport({scale:.6}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;
 await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
 await putBook({id:'b'+Date.now()+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.pdf$/i,''),cat:cat||lcat,total:pdf.numPages,page:1,max:0,cover:c.toDataURL('image/jpeg',.7),blob:new Blob([buf],{type:'application/pdf'})});
}
let cur=null,pdfDoc=null,tok=0;
async function openBook(b){
 cur=b;$('#rt').textContent=b.name;$('#rd').classList.remove('hide');$('#rd').classList.add('show');wake(true);
 try{pdfDoc=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise}catch(e){$('#rt').textContent='Could not open book';return}
 $('#sl').max=b.total;go(b.page||1);
}
async function go(p,dir=0){
 if(!pdfDoc)return;p=Math.max(1,Math.min(cur.total,p));if(dir&&p===cur.page)return;
 if(p>cur.max){addRead(Math.min(5,p-Math.max(cur.max,0)));cur.max=p}
 const old=dir?snap():null;cur.page=p;S.last={name:cur.name,page:p,pct:Math.round(p/cur.total*100)};save();putBook(cur);updBm();schedSoon();
 $('#sl').value=p;$('#rp').textContent=p+' / '+cur.total;
 const my=++tok,pg=await pdfDoc.getPage(p),w=$('#pg').clientWidth||400,dpr=devicePixelRatio||1,v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:(w/v0.width)*dpr}),c=$('#cv');
 c.width=v.width;c.height=v.height;c.style.width=(v.width/dpr)+'px';
 if(my!==tok)return;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
 $('#pg').scrollTop=0;if(old)flip(old,dir);
}
// swipe + tap
let tx=0,ty=0,tt=0;const pgEl=$('#pg');
pgEl.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now()},{passive:true});
pgEl.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur.page+(dx<0?1:-1),dx<0?1:-1);
 else if(Math.abs(dx)<10&&Math.abs(dy)<10&&Date.now()-tt<300)$('#rd').classList.toggle('hide')},{passive:true});
pgEl.addEventListener('click',e=>{if(e.pointerType==='mouse')$('#rd').classList.toggle('hide')});
$('#sl').oninput=e=>{$('#rp').textContent=e.target.value+' / '+cur.total};
$('#sl').onchange=e=>{const v=+e.target.value;go(v,v>cur.page?1:-1)};
let imm=false,tt2=null;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt2);tt2=setTimeout(()=>e.style.display='none',2400)}
// page-turn animation
function snap(){const c=$('#cv');if(!c.width)return null;const r=c.getBoundingClientRect(),sr=$('#stage').getBoundingClientRect(),k=document.createElement('canvas');k.width=c.width;k.height=c.height;k.getContext('2d').drawImage(c,0,0);
 Object.assign(k.style,{position:'absolute',left:(r.left-sr.left)+'px',top:(r.top-sr.top)+'px',width:r.width+'px',height:r.height+'px',pointerEvents:'none',transformOrigin:'0 50%',backfaceVisibility:'hidden',boxShadow:'0 0 28px #0007'});return k}
function flip(old,dir){const st=$('#stage'),o={duration:460,easing:'cubic-bezier(.45,0,.55,1)'};
 if(dir>0){old.style.zIndex=3;st.appendChild(old);old.animate([{transform:'rotateY(0deg)',filter:'brightness(1)'},{transform:'rotateY(-100deg)',filter:'brightness(.55)'}],o).onfinish=()=>old.remove()}
 else{const nw=snap();if(!nw){return}old.style.zIndex=2;nw.style.zIndex=3;st.append(old,nw);nw.animate([{transform:'rotateY(-100deg)',filter:'brightness(.55)'},{transform:'rotateY(0deg)',filter:'brightness(1)'}],o).onfinish=()=>{old.remove();nw.remove()}}}
// bookmarks
const marks=()=>cur.marks||(cur.marks=[]);
function updBm(){const on=marks().includes(cur.page);$('#bm').classList.toggle('mk',on);$('#rib').style.display=on?'block':'none'}
$('#bm').onclick=()=>{const m=marks(),i=m.indexOf(cur.page);if(i<0)m.push(cur.page);else m.splice(i,1);m.sort((a,b)=>a-b);putBook(cur);updBm();toast(i<0?'Bookmarked page '+cur.page:'Bookmark removed')};
$('#bl').onclick=()=>{const m=marks(),o=document.createElement('div');o.className='sheet';
 o.innerHTML=`<div class="sh"><p>Bookmarks</p>${m.length?m.map(n=>`<div class="li" data-p="${n}" style="height:56px;font-size:16px">Page ${n}<span>${Math.round(n/cur.total*100)}%</span></div>`).join(''):'<p style="color:var(--mut);font-weight:400">No bookmarks yet. Tap the bookmark icon on a page you want to keep.</p>'}<button class="big g" id="kp" style="margin-top:6px">Close</button></div>`;
 document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};o.querySelector('#kp').onclick=()=>o.remove();
 o.querySelectorAll('.li').forEach(r=>r.onclick=()=>{const n=+r.dataset.p;o.remove();go(n,n>cur.page?1:-1)})};
// full screen while reading
$('#fs').onclick=async()=>{imm=!imm;try{if(NP.StatusBar){if(imm)await NP.StatusBar.hide();else await NP.StatusBar.show()}else if(imm)await document.documentElement.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen()}catch(e){toast('Full screen is blocked here. Add the app to your Home Screen to hide browser bars.')}
 $('#rd').classList.toggle('hide',imm)};
$('#cl').onclick=()=>{imm=false;if(NP.StatusBar)NP.StatusBar.show();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});$('#rd').classList.remove('show');pdfDoc=null;wake(false);render()};
document.addEventListener('keydown',e=>{if(!pdfDoc)return;if(e.key==='ArrowRight')go(cur.page+1,1);if(e.key==='ArrowLeft')go(cur.page-1,-1)});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;cat=tab==='lib'?cat:null;render()});
applyTheme();open().then(render);sched();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')sched()});
if(NP.App)NP.App.addListener('backButton',()=>{if($('#rd').classList.contains('show'))$('#cl').click();else if(tab==='lib'&&cat){cat=null;render()}else NP.App.exitApp()});
</script></body></html>
